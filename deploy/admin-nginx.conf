# Enable after DNS points admin.medshifter.app at the VPS and its TLS certificate exists.
server {
    listen 80;
    server_name admin.medshifter.app;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://admin.medshifter.app$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name admin.medshifter.app;
    ssl_certificate /etc/letsencrypt/live/admin.medshifter.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.medshifter.app/privkey.pem;

    root /var/www/medshifter/admin;
    index index.html;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { return 404; }
}
